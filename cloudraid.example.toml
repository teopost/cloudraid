# Configurazione di esempio: copiala in cloudraid.toml e adatta i percorsi.
# Il modo più semplice per aggiungere account cloud è l'interfaccia web (Spazi > Aggiungi):
# prova la connessione, salva le credenziali cifrate e scrive questo file per te.
#
# Ogni blocco di dati diventa data_shards + parity_shards frammenti, ognuno su un
# backend diverso. Si possono perdere fino a parity_shards backend senza perdere dati.
# Spazio occupato: (data_shards + parity_shards) / data_shards volte i dati (qui 1,5x).
data_shards = 4
parity_shards = 2

# Blocchi caricati o scaricati in parallelo (predefinito 4); ogni blocco manda
# tutti i suoi frammenti in parallelo, quindi le richieste contemporanee sono
# transfers x (data_shards + parity_shards). Abbassalo se un provider protesta.
# transfers = 4

# Dimensioni dei blocchi (facoltativo, valori predefiniti: 1, 4 e 16 MiB).
# [chunk]
# min = 1048576
# avg = 4194304
# max = 16777216

# Password, chiavi segrete e token NON stanno qui: sono in credenziali.bin accanto a
# questo file, cifrate con la chiave del repository (le scrive l'interfaccia web).

# Servono almeno data_shards + parity_shards backend. Con uno in più, `scrub --repair`
# può spostare i frammenti di un account perso anche senza sostituirlo.
[[backend]]
name = "disco1"
type = "local"
path = "/srv/cloudraid/disco1"
# solo per prove: ogni lettura da questo backend aspetta 1,5 s, come un account lento
# delay_ms = 1500

[[backend]]
name = "disco2"
type = "local"
path = "/srv/cloudraid/disco2"

# WebDAV (Nextcloud, ownCloud, NAS): l'indirizzo della cartella del repository.
# Per Nextcloud: https://<server>/remote.php/dav/files/<utente>/cloudraid
# Password (meglio una "password per app") nelle credenziali.
[[backend]]
name = "nextcloud"
type = "webdav"
url = "https://cloud.esempio.it/remote.php/dav/files/stefano/cloudraid"
user = "stefano"

# S3 e compatibili (AWS, Backblaze B2, Wasabi, MinIO). Chiave segreta nelle credenziali.
[[backend]]
name = "b2"
type = "s3"
endpoint = "https://s3.eu-central-003.backblazeb2.com"
region = "eu-central-003"
bucket = "cloudraid-stefano"
access_key = "0031234567890000000000001"
# prefix = "cloudraid"      # facoltativo: solo una parte del bucket
# path_style = true         # indirizzi endpoint/bucket/oggetto (vale per quasi tutti)

# Dropbox e OneDrive: la cartella dell'app ("Applicazioni/<nome app>"); account collegato
# dall'interfaccia web, token nelle credenziali.
[[backend]]
name = "dropbox"
type = "dropbox"
# folder = "cloudraid"      # facoltativo: una sottocartella

# Google Drive: una cartella nel Drive; cloudraid vede solo i file che crea lui.
[[backend]]
name = "gdrive"
type = "gdrive"
folder = "cloudraid"
# folder_id = "..."         # lo scrive cloudraid quando crea la cartella

# Applicazioni registrate presso i provider con login (una volta sola, vedi il README).
# [apps]
# dropbox_app_key = "..."
# onedrive_client_id = "..."
# google_client_id = "....apps.googleusercontent.com"
# google_client_secret = "..."
