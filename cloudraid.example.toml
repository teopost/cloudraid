# Configurazione di esempio: copiala in cloudraid.toml e adatta i percorsi.
#
# Ogni blocco di dati diventa data_shards + parity_shards frammenti, ognuno su un
# backend diverso. Si possono perdere fino a parity_shards backend senza perdere dati.
# Spazio occupato: (data_shards + parity_shards) / data_shards volte i dati (qui 1,5x).
data_shards = 4
parity_shards = 2

# Blocchi caricati o scaricati in parallelo (predefinito 4); ogni blocco manda
# tutti i suoi frammenti in parallelo, quindi le richieste contemporanee sono
# transfers x (data_shards + parity_shards). Abbassalo se un provider protesta.
# transfers = 4

# Dimensioni dei blocchi (facoltativo, valori predefiniti: 1, 4 e 16 MiB).
# [chunk]
# min = 1048576
# avg = 4194304
# max = 16777216

# Facoltativo: come avviare rclone, per i backend di tipo "rclone".
# [rclone]
# binary = "rclone"
# config = "/root/.config/rclone/rclone.conf"   # predefinito: quello di rclone
# args = ["--tpslimit", "10"]                    # opzioni in più per `rclone rcd`

# Servono almeno data_shards + parity_shards backend. Con uno in più, `scrub --repair`
# può spostare i frammenti di un account perso anche senza sostituirlo.
[[backend]]
name = "account1"
type = "local"
path = "/srv/cloudraid/account1"

[[backend]]
name = "account2"
type = "local"
path = "/srv/cloudraid/account2"

[[backend]]
name = "account3"
type = "local"
path = "/srv/cloudraid/account3"

[[backend]]
name = "account4"
type = "local"
path = "/srv/cloudraid/account4"

# Un backend rclone è un remote configurato con `rclone config`, seguito dalla
# cartella del repository: Google Drive, OneDrive, Dropbox, MEGA, pCloud, SFTP,
# WebDAV, S3 e tutti gli altri provider di rclone.
[[backend]]
name = "gdrive"
type = "rclone"
remote = "gdrive:cloudraid"

[[backend]]
name = "dropbox"
type = "rclone"
remote = "dropbox:cloudraid"
