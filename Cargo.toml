[package]
name = "cloudraid"
version = "0.9.1"
edition = "2021"
description = "Archivio cifrato con ridondanza Reed-Solomon distribuito su più storage"
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
fastcdc = "3"
fuser = { version = "0.19", default-features = false }
hex = "0.4"
hmac = "0.12"
libc = "0.2"
reed-solomon-simd = "3"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.4"
tiny_http = "0.12"
toml = "0.8"
toml_edit = "0.22"
ureq = { version = "2", default-features = false, features = ["tls"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"

# i test usano molta CPU (Reed-Solomon, argon2): ottimizzati anche loro
[profile.test]
opt-level = 3
