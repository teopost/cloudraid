# cloudraid: interfaccia web di amministrazione (servizio `web`) e riga di comando (servizio `cloudraid`).
#
# - web: sempre acceso, dietro Traefik, solo dalla LAN (middleware lan-only@file). Risponde su
#   https://<LAN_IP>/cloudraid/ e, se c'è un nome che lo risolve, su https://<CLOUDRAID_HOST>/.
#   Il login usa la password del repository, che resta solo in memoria: dopo un riavvio serve un nuovo accesso.
# - mount: il repository come cartella sull'host (/mnt/cloudraid/archivio), facoltativo.
# - cloudraid: la riga di comando, a richiesta, con lo script ./cloudraid (es. `./cloudraid status`).
#   Il profilo "cli" evita che `docker compose up -d` lo avvii.
#
# In .env (vedi .env.example): LAN_IP; facoltativi CLOUDRAID_HOST, CLOUDRAID_PASSWORD (riga di comando
# non interattiva e mount) e COMPOSE_PROFILES=mount per accendere il mount.
services:
  web:
    build: .
    image: cloudraid:local
    container_name: cloudraid-web
    command: ["serve", "--listen", "0.0.0.0:8080"]
    restart: unless-stopped
    environment:
      TZ: Europe/Rome
    volumes:
      # cloudraid.toml (l'interfaccia la modifica), credenziali.bin (cifrate), cloudraid.key, web-state.json
      - ./config:/config
      # backend locali: stesso percorso dentro e fuori dal container
      - /srv/cloudraid:/srv/cloudraid
    networks: [proxy]
    # niente porte pubblicate: si passa solo da Traefik
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.cloudraid.rule=Host(`${CLOUDRAID_HOST:-cloudraid.invalid}`) || (Host(`${LAN_IP:?imposta LAN_IP in .env}`) && PathPrefix(`/cloudraid`))
      - traefik.http.routers.cloudraid.entrypoints=websecure
      - traefik.http.routers.cloudraid.middlewares=lan-only@file,security-headers@file,cloudraid-prefix
      - traefik.http.middlewares.cloudraid-prefix.stripprefix.prefixes=/cloudraid
      - traefik.http.services.cloudraid.loadbalancer.server.port=8080

  mount:
    # Il repository come cartella sull'host: ${CLOUDRAID_MOUNT_DIR}/archivio (predefinito
    # /mnt/cloudraid/archivio), in lettura e scrittura (CLOUDRAID_MOUNT_RW=false per la sola lettura).
    # Profilo "mount": si attiva con COMPOSE_PROFILES=mount in .env, e serve CLOUDRAID_PASSWORD in .env
    # perché all'avvio non c'è nessuno a digitarla. I file in scrittura passano in chiaro da /tmp del
    # container (sul disco di sistema) e vengono cancellati appena caricati.
    image: cloudraid:local
    pull_policy: never
    container_name: cloudraid-mount
    profiles: ["mount"]
    command:
      - mount
      - /mnt/cloudraid/archivio
      - --allow-other
      - --uid=${CLOUDRAID_MOUNT_UID:-1000}
      - --gid=${CLOUDRAID_MOUNT_GID:-1000}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Europe/Rome
      CLOUDRAID_MOUNT_RW: ${CLOUDRAID_MOUNT_RW:-true}
    # FUSE: il dispositivo, il permesso di montare e niente profilo AppArmor docker-default (vieta mount)
    devices: [/dev/fuse]
    cap_add: [SYS_ADMIN]
    security_opt: [apparmor=unconfined]
    volumes:
      - ./config:/config
      - /srv/cloudraid:/srv/cloudraid
      # si monta la cartella madre con propagazione condivisa: il mount fatto nel container
      # compare sull'host, e se il processo morisse male un mount appeso in archivio/ non
      # impedirebbe al container di ripartire (lo smonta da solo all'avvio)
      - type: bind
        source: ${CLOUDRAID_MOUNT_DIR:-/mnt/cloudraid}
        target: /mnt/cloudraid
        bind:
          propagation: rshared
          create_host_path: true
    # allo stop smonta in modo pulito (SIGTERM)
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /mnt/cloudraid/archivio fuse' /proc/mounts && ls /mnt/cloudraid/archivio >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3

  cloudraid:
    image: cloudraid:local
    pull_policy: never     # immagine solo locale: `make build`
    profiles: ["cli"]
    env_file:
      - path: .env          # facoltativo: CLOUDRAID_PASSWORD per gli usi non interattivi
        required: false
    environment:
      TZ: Europe/Rome
    volumes:
      - ./config:/config
      - /srv/cloudraid:/srv/cloudraid

networks:
  proxy:
    external: true
